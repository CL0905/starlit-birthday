  class ParticleSystem{constructor(){this.c=$("particleCanvas");this.x=this.c.getContext("2d");this.mode="drift";this.points=[];this.ps=[];this.t=0;this.hidden=false;this.hold=0;this.resize();addEventListener("resize",()=>this.resize(),{passive:true});document.addEventListener("visibilitychange",()=>this.hidden=document.hidden);document.addEventListener("pointerdown",e=>{if(e.target.tagName!=="BUTTON")this.ripple(e.clientX,e.clientY)});for(let i=0;i<this.count();i++)this.ps.push(this.make());this.shape("gift",null,true);this.frame()}count(){return innerWidth<600?190:360}resize(){const d=Math.min(devicePixelRatio||1,2);this.w=innerWidth;this.h=innerHeight;this.c.width=this.w*d;this.c.height=this.h*d;this.x.setTransform(d,0,0,d,0,0)}make(){return{x:Math.random()*this.w,y:Math.random()*this.h,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,z:.75+Math.random()*1.65,r:1.2+Math.random()*3.8,tx:null,ty:null,life:.72+Math.random()*.34,spin:Math.random()*Math.PI,kind:Math.random()<.18?"diamond":"dot"}}shape(name,word,immediate=false){if(reduced){this.mode="static";return}clearTimeout(this.hold);this.points=patterns[name]?.(this.w,this.h,word)||patterns.swirl(this.w,this.h);this.mode="target";this.ps.forEach((p,i)=>{const q=this.points[i%this.points.length];p.tx=q.x+(Math.random()-.5)*3.5;p.ty=q.y+(Math.random()-.5)*3.5;if(immediate){p.x=p.tx+(Math.random()-.5)*6;p.y=p.ty+(Math.random()-.5)*6;p.vx=0;p.vy=0}});this.hold=setTimeout(()=>{this.mode="drift";this.ps.forEach(p=>{p.vx=(Math.random()-.5)*.44;p.vy=(Math.random()-.5)*.44;p.tx=null;p.ty=null})},name==="swirl"?1700:5600)}burst(){this.mode="burst";clearTimeout(this.hold);this.ps.forEach(p=>{p.vx=(p.x-this.w/2)/82+Math.random()-.5;p.vy=(p.y-this.h/2)/82+Math.random()-.5;p.tx=null;p.ty=null})}ripple(x,y){for(let i=0;i<34;i++)this.ps.push({x,y,vx:(Math.random()-.5)*2.6,vy:(Math.random()-.5)*2.6,z:1.45,r:1.8+Math.random()*3.4,life:.9,spin:Math.random()*Math.PI,kind:"diamond"})}frame(){if(!this.hidden){const x=this.x;x.fill   const patterns={heart:(w,h)=>{const a=[];for(let i=0;i<220;i++){const t=i/220*Math.PI*2,x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));a.push({x:w/2+x*w*.018,y:h/2+y*h*.025})}return a},gift:(w,h)=>{const a=[];for(let i=0;i<220;i++){const t=i/220;let x,y;if(t<.25){x=.38+t/.25*.24;y=.42}else if(t<.5){x=.62;y=.42+(t-.25)/.25*.28}else if(t<.75){x=.62-(t-.5)/.25*.24;y=.7}else{x=.38;y=.7-(t-.75)/.25*.28}a.push({x:w*x,y:h*y})}for(let i=0;i<60;i++)a.push({x:w*(.5+(Math.random()-.5)*.06),y:h*(.36+Math.random()*.34)});return a},envelope:(w,h)=>{const a=[];for(let i=0;i<180;i++){const t=i/180;const x=w*(.32+t*.36),y=h*(.42+(i%2)*.22);a.push({x,y},{x:w*.32+t*w*.18,y:h*.42+t*h*.22},{x:w*.68-t*w*.18,y:h*.42+t*h*.22})}return a},cake:(w,h)=>{const a=[];for(let i=0;i<170;i++){const t=i/170;a.push({x:w*(.36+t*.28),y:h*.66},{x:w*(.36+t*.28),y:h*.5})}for(let i=0;i<40;i++)a.push({x:w*(.44+i/40*.12),y:h*(.34-Math.sin(i/40*Math.PI)*.08)});return a},crown:(w,h)=>{const pts=[[.38,.62],[.42,.42],[.5,.58],[.58,.42],[.62,.62]];return linePts(w,h,pts,48)},swirl:(w,h)=>{const a=[];for(let i=0;i<220;i++){const t=i/18,r=i*.9;a.push({x:w/2+Math.cos(t)*r,y:h/2+Math.sin(t)*r*.55})}return a},text:(w,h,word)=>textPoints(w,h,word||"YOU"),final:(w,h)=>textPoints(w,h,"Happy Birthday")};
  function linePts(w,h,pts,n){const a=[];for(let i=0;i<pts.length-1;i++){for(let j=0;j<n;j++){const t=j/n;a.push({x:w*(pts[i][0]*(1-t)+pts[i+1][0]*t),y:h*(pts[i][1]*(1-t)+pts[i+1][1]*t)})}}return a}
  function textPoints(w,h,word){const c=document.createElement("canvas"),x=c.getContext("2d");c.width=620;c.height=190;x.fillStyle="#fff";x.font="800 72px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(word,310,95);const d=x.getImageData(0,0,c.width,c.height).data,a=[];for(let y=0;y<c.height;y+=5)for(let xx=0;xx<c.width;xx+=5)if(d[(y*c.width+xx)*4+3]>80)a.push({x:w/2+(xx-310)*Math.min(w/760,1.35),y:h/2+(y-95)*Math.min(w/760,1.35)});return a.length?a:patterns.heart(w,h)}
  function confetti(n){const c=$("confetti"),x=c.getContext("2d"),d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);const cs=["#ff8fb4","#ffd3df","#d8b56d","#fff8f5"],p=Array.from({length:n},()=>({x:innerWidth*(.25+Math.random()*.5),y:innerHeight*.3,vx:-4+Math.random()*8,vy:-7+Math.random()*4,s:3+Math.random()*6,a:Math.random()*6,c:cs[Math.floor(Math.random()*cs.length)],l:80+Math.random()*40}));(function f(){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.15;o.a+=.12;o.l--;x.save();x.translate(o.x,o.y);x.rotate(o.a);x.fillStyle=o.c;x.fillRect(-o.s,-o.s/2,o.s*2,o.s);x.restore()});if(p.some(o=>o.l>0&&o.y<innerHeight+40))requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})()}
  const particle=new ParticleSystem();
  if(state.index>0){$("resume").classList.add("show");$("resumeYes").onclick=()=>{$("resume").classList.remove("show");render()};$("resumeNo").onclick=()=>{$("resume").classList.remove("show");reset()}} else render();
