<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Happy Birthday</title>
  <style>
    :root {
      --bg:#050306; --bg2:#09050a; --ink:#fff8f5; --muted:#cdb8c1;
      --rose:#ff8fb4; --rose2:#ffd3df; --gold:#d8b56d; --glass:rgba(20,12,20,.54);
      --line:rgba(255,174,199,.22); --shadow:0 28px 90px rgba(0,0,0,.52);
      --sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
      --serif:"Noto Serif TC","Songti TC",Georgia,serif;
    }
    *{box-sizing:border-box} html,body{width:100%;min-height:100%;margin:0;overflow-x:hidden}
    body{background:radial-gradient(circle at 72% 18%,rgba(255,143,180,.14),transparent 28rem),linear-gradient(145deg,var(--bg),var(--bg2) 58%,#120811);color:var(--ink);font-family:var(--sans)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='.42'/%3E%3C/svg%3E");mix-blend-mode:screen}
    button,input{font:inherit} button{min-height:46px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.075);color:var(--ink);padding:0 18px;cursor:pointer;box-shadow:0 14px 42px rgba(0,0,0,.28);transition:transform .18s ease,border-color .18s ease,background .18s ease}
    button:hover{transform:translateY(-1px);border-color:rgba(255,211,223,.56);background:rgba(255,143,180,.12)} button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--rose2);outline-offset:3px} button.primary{background:linear-gradient(135deg,#fff2ed,#ff9fbd 54%,#d8b56d);color:#13070d;border:0;font-weight:800} button[disabled]{opacity:.52;cursor:not-allowed;transform:none}
    #particleCanvas,#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none} #particleCanvas{z-index:0} #confetti{z-index:30}
    .app{position:relative;z-index:2;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(14px,env(safe-area-inset-top)) clamp(14px,4vw,48px) max(14px,env(safe-area-inset-bottom))}
    .hud{height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.brand,.chapter,.secret-count{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}.chapter{justify-self:center}.secret-count{justify-self:end;color:var(--rose2)}
    .orbit{display:flex;gap:7px;align-items:center;justify-content:center}.orbit span{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.16);box-shadow:0 0 0 transparent}.orbit span.active{background:var(--rose2);box-shadow:0 0 18px rgba(255,143,180,.88)}.orbit span.done{background:rgba(216,181,109,.62)}
    .stage{min-height:calc(100svh - 132px);display:grid;place-items:center}.scene{width:min(100%,1180px);min-height:min(760px,calc(100svh - 132px));display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,520px);align-items:center;gap:clamp(24px,6vw,86px);opacity:1;transform:none}.scene.full{grid-template-columns:minmax(0,920px);text-align:center}.scene.quiet{max-width:820px}
    @keyframes enter{to{opacity:1;transform:none}} .copy{display:grid;gap:18px}.eyebrow{margin:0;color:var(--rose2);font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:800}.kicker{color:var(--gold)} h1,h2,h3,p{margin:0} h1,h2{font-family:var(--serif);font-weight:700;letter-spacing:0} h1{font-size:clamp(54px,11vw,152px);line-height:.88;text-wrap:balance;text-shadow:0 0 40px rgba(255,143,180,.18)} h2{font-size:clamp(34px,7vw,82px);line-height:.95;text-wrap:balance} h3{font-size:clamp(20px,2.4vw,28px)} p{color:var(--muted);font-size:clamp(16px,2vw,20px);line-height:1.75}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.panel{display:grid;gap:16px;width:min(100%,720px);padding:clamp(18px,3vw,30px);border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,143,180,.055));backdrop-filter:blur(22px);border-radius:18px;box-shadow:var(--shadow)}.note{min-height:46px;padding:12px 14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.055);color:var(--muted);line-height:1.55}
    .photo{position:relative;width:min(100%,680px);aspect-ratio:4/3;overflow:hidden;border-radius:22px;border:1px solid rgba(255,211,223,.22);background:linear-gradient(135deg,rgba(255,143,180,.18),rgba(216,181,109,.08));box-shadow:0 0 80px rgba(255,143,180,.12),var(--shadow)}.photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:var(--focus,50% 50%)}.photo.empty{display:grid;place-items:center}.photo.empty:after{content:attr(data-label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}.photo.blur img{filter:blur(18px) scale(1.08);transition:filter 1s ease,transform 1s ease}.photo.clear img{filter:none;transform:none}.choice-grid{display:grid;gap:10px}.choice-grid button{text-align:left;border-radius:14px;min-height:54px}.shake{animation:shake .28s ease}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.secret-heart{position:absolute;z-index:5;width:34px;height:34px;min-height:34px;padding:0;border-radius:999px;color:rgba(255,211,223,.45);background:rgba(255,143,180,.055);box-shadow:none}.secret-heart:hover{color:#fff;background:rgba(255,143,180,.18)}.secret-heart.found{opacity:.28;pointer-events:none}
    .scratch{width:min(100%,650px);aspect-ratio:4/3;position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:none;background:#120711}.scratch .under{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}.scratch .under img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.52}.scratch strong{position:relative;font-family:var(--serif);font-size:clamp(24px,5vw,48px);text-shadow:0 0 28px #000}#scratchCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .puzzle{width:min(86vw,540px);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border-radius:20px;background:rgba(255,255,255,.08);box-shadow:var(--shadow)}.tile{border-radius:12px;border:0;min-height:0;padding:0;background-size:300% 300%;background-repeat:no-repeat}.tile.selected{outline:3px solid var(--rose2);outline-offset:-3px}.puzzle.done{gap:0;padding:0;box-shadow:0 0 70px rgba(255,143,180,.42)}
    .timeline{width:min(100%,780px);display:grid;gap:12px;text-align:left}.event{display:grid;grid-template-columns:120px 160px 1fr;gap:16px;align-items:center;padding:14px;border-top:1px solid var(--line);opacity:0;transform:translateY(12px);animation:enter .45s ease forwards}.event time{color:var(--gold);font-size:13px;font-weight:800}.event .thumb{height:96px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.08)}.event img{width:100%;height:100%;object-fit:cover}
    .counter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,760px)}.count-box{padding:18px 12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06)}.count-box strong{display:block;font:800 clamp(34px,7vw,70px)/1 var(--serif)}.count-box span{color:var(--muted)}
    .gallery-wrap{width:min(100%,840px);height:min(70svh,560px);display:grid;place-items:center;touch-action:pan-y;position:relative}.card{position:absolute;width:min(72vw,330px);aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .3s ease,opacity .3s ease;cursor:pointer}.card-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s ease}.card.flipped .card-inner{transform:rotateY(180deg)}.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;overflow:hidden;border:1px solid rgba(255,211,223,.22);background:#130910;box-shadow:var(--shadow)}.card-face img{width:100%;height:100%;object-fit:cover}.card-back{transform:rotateY(180deg);display:grid;place-items:center;padding:24px;color:var(--ink);background:linear-gradient(135deg,rgba(255,143,180,.18),rgba(255,255,255,.08))}
    .letter-envelope{width:min(72vw,340px);aspect-ratio:1.45;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,143,180,.1));box-shadow:0 0 80px rgba(255,143,180,.18);position:relative}.letter-envelope:before,.letter-envelope:after{content:"";position:absolute;inset:0;clip-path:polygon(0 0,50% 62%,100% 0,100% 100%,0 100%);background:rgba(255,211,223,.08)}.paper{width:min(100%,760px);max-height:64svh;overflow:auto;padding:clamp(22px,5vw,46px);border:1px solid var(--line);border-radius:18px;background:rgba(255,248,245,.92);color:#17080f;text-align:left;box-shadow:var(--shadow)}.paper p{color:#27141d;margin-bottom:1em;opacity:0;animation:enter .48s ease forwards}
    .cake{width:min(78vw,420px)}.flame{transform-origin:center bottom;animation:flicker .65s infinite alternate ease-in-out}.cake.out .flame{opacity:0;animation:none}.smoke{opacity:0}.cake.out .smoke{animation:smoke 1.3s ease forwards}@keyframes flicker{to{transform:scale(.84) rotate(5deg)}}@keyframes smoke{0%{opacity:0;transform:translateY(8px)}25%{opacity:1}100%{opacity:0;transform:translateY(-44px) scale(1.6)}}.blackout{position:fixed;inset:0;background:#000;z-index:21;display:grid;place-items:center;opacity:0;pointer-events:none}.blackout.show{opacity:1;pointer-events:auto}.music{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:12;display:none;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:999px;background:rgba(10,4,9,.72);backdrop-filter:blur(18px)}.music.visible{display:flex}.music button{width:38px;min-height:38px;padding:0}.music input{width:78px;accent-color:var(--rose)}
    .resume,.date-prompt{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.74);padding:20px}.resume.show,.date-prompt.show{display:grid}.dialog{width:min(100%,430px);display:grid;gap:14px;padding:24px;border:1px solid var(--line);border-radius:18px;background:rgba(18,8,16,.94);box-shadow:var(--shadow);text-align:center}.date-prompt{z-index:45}.date-prompt .dialog{transition:transform .24s ease}.date-actions{display:flex;gap:10px;align-items:stretch;justify-content:center;min-height:54px}.date-actions button{flex:1 1 0}.date-yes{transition:transform .25s ease,width .25s ease,height .25s ease,border-radius .25s ease,font-size .25s ease}.date-prompt.takeover{padding:0}.date-prompt.takeover .dialog{width:100%;height:100%;border-radius:0;border:0;place-items:center}.date-prompt.takeover .date-actions{position:absolute;inset:0}.date-prompt.takeover .date-no,.date-prompt.takeover h3,.date-prompt.takeover p{display:none}.date-prompt.takeover .date-yes{width:100%;height:100%;border-radius:0;font-size:clamp(38px,12vw,120px)}
    @media(max-width:820px){.app{padding-left:14px;padding-right:14px}.hud{grid-template-columns:1fr auto}.chapter{display:none}.stage{min-height:calc(100svh - 118px)}.scene,.scene.full{grid-template-columns:1fr;min-height:auto;gap:20px}.counter{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:1fr}.event .thumb{height:180px}.actions button{flex:1 1 100%}.music{left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));justify-content:center}.gallery-wrap{height:500px}}
    @media(max-width:420px){h1{font-size:52px}.hud{height:52px}.brand{max-width:58vw;overflow:hidden;text-overflow:ellipsis}.secret-count{letter-spacing:.08em}.photo{border-radius:18px}.panel{border-radius:16px;padding:16px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}.giftFloat{animation:none!important}}
  </style>
</head>
<body>
  <canvas id="particleCanvas" aria-hidden="true"></canvas>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <main class="app">
    <header class="hud">
      <div class="brand" id="brand">Birthday</div>
      <div><div class="chapter" id="chapterText">I / XII</div><div class="orbit" id="orbit" aria-hidden="true"></div></div>
      <div class="secret-count" id="secretCount">♡ 0/3</div>
    </header>
    <section class="stage" id="stage" aria-live="polite"></section>
    <footer></footer>
  </main>
  <div class="music" id="musicBox" aria-label="音樂控制">
    <button id="playBtn" aria-label="播放或暫停">♪</button>
    <button id="muteBtn" aria-label="靜音">◎</button>
    <input id="volume" type="range" min="0" max="1" step=".01" value=".48" aria-label="音量">
    <span id="musicStatus" style="font-size:12px;color:var(--muted)">ready</span>
  </div>
  <div class="blackout" id="blackout"></div>
  <div class="resume" id="resume">
    <div class="dialog">
      <h3>要繼續剛才的生日驚喜嗎？</h3>
      <p>我有記住你玩到哪裡。</p>
      <div class="actions"><button class="primary" id="resumeYes">繼續</button><button id="resumeNo">重新開始</button></div>
    </div>
  </div>
  <div class="date-prompt" id="datePrompt" aria-modal="true" role="dialog">
    <div class="dialog">
      <h3 id="dateTitle">你是否願意與我約會？</h3>
      <p id="dateText">可以按按看不願意。</p>
      <div class="date-actions"><button class="primary date-yes" id="dateYes">願意</button><button class="date-no" id="dateNo">不願意</button></div>
    </div>
  </div>
  <script>
  "use strict";
  const CONFIG = loadEmbeddedConfig(/*__CONFIG__*/{
    partnerName:"親愛的你", partnerInitials:"YOU", myName:"最想陪你過生日的人", myInitials:"ME",
    birthday:"2026-09-18", relationshipStartDate:"2024-02-14T00:00:00+08:00",
    openingLine:"我把幾個小回憶做成一趟生日旅程。慢慢玩，最後有話想跟你說。",
    memoryQuestion:{prompt:"我們第一次一起慶祝的小日子是哪一天？",answers:["2024.02.14","2024.04.20","2025.08.08"],correctIndex:1,date:"2024.04.20",place:"那個很亮的下午",memory:"答對了。那天其實很普通，但因為是我們一起記住的日子，所以後來就變得很亮。",image:"memory-question"},
    quiz:[{question:"我最想跟你一起完成哪件事？",answers:["吃一個漂亮蛋糕","拍一張很鬧的合照","一起去新的城市走走"],correctIndex:2,hint:"有吃有拍照也很好，但我更想跟你一起走遠一點。"},{question:"如果今天只能留下一句話，我會說？",answers:["生日快樂","你值得被好好喜歡","今天蛋糕歸我"],correctIndex:1,hint:"蛋糕可以分，但這句話不能省。"},{question:"這份禮物最重要的是什麼？",answers:["動畫","照片","心意"],correctIndex:2,hint:"視覺要漂亮，但真正發光的是心意。"}],
    scratch:{image:"memory-2",message:"你被喜歡著，而且比你想的還要多。"}, puzzle:{image:"puzzle",message:"拼圖完成。還好我們不用被拼回去。"},
    timeline:[{date:"2024.02.14",title:"第一個小記號",description:"有些日子當下只是日子，後來才知道它會被記很久。",photo:"memory-1"},{date:"2024.04.20",title:"一起笑到停不下來",description:"那種很小、很輕、但一直留在心裡的快樂。",photo:"memory-2"},{date:"2026.09.18",title:"今天",description:"今天不是結尾，是新一頁。生日快樂。",photo:"final"}],
    memories:[{image:"memory-1",caption:"第一張想放進故事裡的照片。"},{image:"memory-2",caption:"很喜歡的某個瞬間。"},{image:"memory-3",caption:"想再一起去一次的地方。"}],
    secretHearts:["memory","quiz","timeline"], secretMemory:{image:"secret",text:"這是只有認真找的人才會看到的小秘密。謝謝你把這份心意玩得這麼完整。"},
    letter:["生日快樂。謝謝你一直用你的方式，讓很多普通的日子變得很可愛。","我希望這一年你能更常被溫柔對待，也能更靠近你真正想要的生活。","接下來還想陪你吃很多餐、走很多路、拍很多照片，然後把今天也變成以後會笑著提起的回憶。"],
    finalMessage:"願你的生日像今天的燭光一樣，亮、暖，而且被好好守著。", music:"",
    assets:{"memory-question":"","memory-1":"","memory-2":"","memory-3":"","puzzle":"","final":"","secret":""},
    assetMeta:{"memory-question":{alt:"照片猜猜看照片",focus:"50% 50%"}}
  });
  const CHAPTERS=["INTRO","MEMORY","QUIZ","SCRATCH","PUZZLE","TIMELINE","COUNTER","GALLERY","SECRET","LETTER","CAKE","FINAL"];
  const ROMAN=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
  const STORE="birthday-progress-v4"; const EDITOR_DRAFT_STORE="birthday-editor-draft-v4"; const $=id=>document.getElementById(id); const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let state=loadState(), lock=false, audio=null, galleryIndex=0, galleryStart=0, scratchDone=false, timelineCount=1, quiet=false;
  function loadEmbeddedConfig(base,allowDraft=true){let cfg=base;try{const p=new URLSearchParams(location.search);if(allowDraft&&p.get("draft")!=="0"){const draft=localStorage.getItem("birthday-editor-draft-v4");if(draft)cfg=mergeConfig(base,JSON.parse(draft))}}catch{}return normalizeConfig(cfg)}
  function mergeConfig(base,patch){const out=JSON.parse(JSON.stringify(base));(function deep(t,s){Object.entries(s||{}).forEach(([k,v])=>{if(v&&typeof v==="object"&&!Array.isArray(v)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k]))deep(t[k],v);else t[k]=v})})(out,patch);return out}
  function normalizeConfig(c){c.assets||(c.assets={});c.assetMeta||(c.assetMeta={});if(!Object.prototype.hasOwnProperty.call(c.assets,"memory-question"))c.assets["memory-question"]="";c.assetMeta["memory-question"]={alt:"照片猜猜看照片",focus:"50% 50%",...(c.assetMeta["memory-question"]||{})};if(c.memoryQuestion&&(!c.memoryQuestion.image||c.memoryQuestion.image==="memory-1"))c.memoryQuestion.image="memory-question";return c}
  function defaultState(){return{index:0,quizIndex:0,quizScore:0,scratch:false,puzzleOrder:[],puzzleDone:false,timelineShown:1,secrets:[],letterOpened:false,cakeStep:0,finalSeen:false,dateNoCount:0,dateAccepted:false,datePromptShown:false}}
  function storage(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return localStorage}catch{return null}}
  function loadState(){const s=storage();if(!s)return defaultState();try{return{...defaultState(),...(JSON.parse(s.getItem(STORE))||{})}}catch{return defaultState()}}
  function save(){const s=storage();if(s)try{s.setItem(STORE,JSON.stringify(state))}catch{}}
  function reset(){state=defaultState();galleryIndex=0;scratchDone=false;timelineCount=1;save();particle.shape("gift");render()}
  function t(tag,txt,cls){const e=document.createElement(tag); if(cls)e.className=cls; e.textContent=txt; return e}
  function btn(label,fn,cls=""){const b=document.createElement("button");b.type="button";b.textContent=label;b.className=cls;b.onclick=()=>{if(lock)return;fn()};return b}
  function scene(cls=""){const s=$("stage");s.textContent="";const div=document.createElement("div");div.className="scene "+cls;s.appendChild(div);$("brand").textContent=`${CONFIG.partnerName} Birthday`; $("chapterText").textContent=`${ROMAN[state.index]} / XII · ${CHAPTERS[state.index]}`; $("secretCount").textContent=`♡ ${state.secrets.length}/3`; drawOrbit(); return div}
  function drawOrbit(){const o=$("orbit");o.textContent="";CHAPTERS.forEach((_,i)=>{const n=document.createElement("span");if(i<state.index)n.className="done";if(i===state.index)n.className="active";o.appendChild(n)})}
  function next(){if(state.index>=CHAPTERS.length-1)return; lock=true; particle.shape("swirl"); setTimeout(()=>{state.index++; save(); lock=false; render()}, reduced?60:520)}
  function asset(k){return CONFIG.assets&&CONFIG.assets[k]||""}
  function imgEl(k,alt){const src=asset(k);const m=CONFIG.assetMeta&&CONFIG.assetMeta[k]||{};const box=document.createElement("div");box.className="photo"+(src?"":" empty");box.dataset.label=alt||k;if(m.focus)box.style.setProperty("--focus",m.focus); if(src){const im=new Image();im.alt=m.alt||alt||k;im.src=src;im.onerror=()=>{box.classList.add("empty");box.textContent=""};box.appendChild(im)} return box}
  function actions(...nodes){const a=document.createElement("div");a.className="actions";a.append(...nodes);return a}
  function addSecret(root,name){if(state.secrets.includes(name))return;const h=btn("♡",()=>{if(!state.secrets.includes(name)){state.secrets.push(name);save();h.classList.add("found");$("secretCount").textContent=`♡ ${state.secrets.length}/3`;particle.shape("crown");softPing();}}, "secret-heart");h.style.left=(15+Math.random()*70)+"%";h.style.top=(18+Math.random()*58)+"%";root.style.position="relative";root.appendChild(h)}

  class ParticleSystem{constructor(){this.c=$("particleCanvas");this.x=this.c.getContext("2d");this.mode="drift";this.points=[];this.ps=[];this.t=0;this.hidden=false;this.hold=0;this.resize();addEventListener("resize",()=>this.resize(),{passive:true});document.addEventListener("visibilitychange",()=>this.hidden=document.hidden);document.addEventListener("pointerdown",e=>{if(e.target.tagName!=="BUTTON")this.ripple(e.clientX,e.clientY)});for(let i=0;i<this.count();i++)this.ps.push(this.make());this.shape("gift",null,true);this.frame()}count(){return innerWidth<600?190:360}resize(){const d=Math.min(devicePixelRatio||1,2);this.w=innerWidth;this.h=innerHeight;this.c.width=this.w*d;this.c.height=this.h*d;this.x.setTransform(d,0,0,d,0,0)}make(){return{x:Math.random()*this.w,y:Math.random()*this.h,vx:(Math.random()-.5)*.12,vy:(Math.random()-.5)*.12,z:.75+Math.random()*1.65,r:1.2+Math.random()*3.8,tx:null,ty:null,life:.72+Math.random()*.34,spin:Math.random()*Math.PI,kind:Math.random()<.18?"diamond":"dot"}}shape(name,word,immediate=false){if(reduced){this.mode="static";return}clearTimeout(this.hold);this.points=patterns[name]?.(this.w,this.h,word)||patterns.swirl(this.w,this.h);this.mode="target";this.ps.forEach((p,i)=>{const q=this.points[i%this.points.length];p.tx=q.x+(Math.random()-.5)*3.5;p.ty=q.y+(Math.random()-.5)*3.5;if(immediate){p.x=p.tx+(Math.random()-.5)*6;p.y=p.ty+(Math.random()-.5)*6;p.vx=0;p.vy=0}});this.hold=setTimeout(()=>{this.mode="drift";this.ps.forEach(p=>{p.vx=(Math.random()-.5)*.44;p.vy=(Math.random()-.5)*.44;p.tx=null;p.ty=null})},name==="swirl"?1700:5600)}burst(){this.mode="burst";clearTimeout(this.hold);this.ps.forEach(p=>{p.vx=(p.x-this.w/2)/82+Math.random()-.5;p.vy=(p.y-this.h/2)/82+Math.random()-.5;p.tx=null;p.ty=null})}ripple(x,y){for(let i=0;i<34;i++)this.ps.push({x,y,vx:(Math.random()-.5)*2.6,vy:(Math.random()-.5)*2.6,z:1.45,r:1.8+Math.random()*3.4,life:.9,spin:Math.random()*Math.PI,kind:"diamond"})}frame(){if(!this.hidden){const x=this.x;x.fillStyle=reduced?"rgba(5,3,6,.9)":"rgba(5,3,6,.22)";x.fillRect(0,0,this.w,this.h);this.ps.forEach(p=>{if(this.mode==="target"&&p.tx!==null){p.vx+=(p.tx-p.x)*.028;p.vy+=(p.ty-p.y)*.028}p.vx*=.86;p.vy*=.86;p.x+=p.vx;p.y+=p.vy;p.spin+=.018*p.z;if(p.x<-30||p.x>this.w+30||p.y<-30||p.y>this.h+30){Object.assign(p,this.make())}p.life-=.0028;if(p.life<=0){Object.assign(p,this.make())}const a=Math.min(.92,.48*p.z*p.life),r=p.r*p.z;x.save();x.translate(p.x,p.y);x.rotate(p.spin);x.shadowColor="rgba(255,196,216,1)";x.shadowBlur=24*p.z;x.fillStyle=`rgba(255,${176+Math.floor(42*p.z)},${202+Math.floor(28*p.z)},${a})`;if(p.kind==="diamond"){x.beginPath();x.moveTo(0,-r*1.35);x.lineTo(r,0);x.lineTo(0,r*1.35);x.lineTo(-r,0);x.closePath();x.fill()}else{x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.fill();x.fillStyle=`rgba(255,248,245,${Math.min(.9,a+.18)})`;x.beginPath();x.arc(-r*.22,-r*.22,Math.max(1,r*.34),0,Math.PI*2);x.fill()}x.restore()})}requestAnimationFrame(()=>this.frame())}}
  const patterns={heart:(w,h)=>{const a=[];for(let i=0;i<220;i++){const t=i/220*Math.PI*2,x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));a.push({x:w/2+x*w*.018,y:h/2+y*h*.025})}return a},gift:(w,h)=>{const a=[];for(let i=0;i<220;i++){const t=i/220;let x,y;if(t<.25){x=.38+t/.25*.24;y=.42}else if(t<.5){x=.62;y=.42+(t-.25)/.25*.28}else if(t<.75){x=.62-(t-.5)/.25*.24;y=.7}else{x=.38;y=.7-(t-.75)/.25*.28}a.push({x:w*x,y:h*y})}for(let i=0;i<60;i++)a.push({x:w*(.5+(Math.random()-.5)*.06),y:h*(.36+Math.random()*.34)});return a},envelope:(w,h)=>{const a=[];for(let i=0;i<180;i++){const t=i/180;const x=w*(.32+t*.36),y=h*(.42+(i%2)*.22);a.push({x,y},{x:w*.32+t*w*.18,y:h*.42+t*h*.22},{x:w*.68-t*w*.18,y:h*.42+t*h*.22})}return a},cake:(w,h)=>{const a=[];for(let i=0;i<170;i++){const t=i/170;a.push({x:w*(.36+t*.28),y:h*.66},{x:w*(.36+t*.28),y:h*.5})}for(let i=0;i<40;i++)a.push({x:w*(.44+i/40*.12),y:h*(.34-Math.sin(i/40*Math.PI)*.08)});return a},crown:(w,h)=>{const pts=[[.38,.62],[.42,.42],[.5,.58],[.58,.42],[.62,.62]];return linePts(w,h,pts,48)},swirl:(w,h)=>{const a=[];for(let i=0;i<220;i++){const t=i/18,r=i*.9;a.push({x:w/2+Math.cos(t)*r,y:h/2+Math.sin(t)*r*.55})}return a},text:(w,h,word)=>textPoints(w,h,word||"YOU"),final:(w,h)=>textPoints(w,h,"Happy Birthday")};
  function linePts(w,h,pts,n){const a=[];for(let i=0;i<pts.length-1;i++){for(let j=0;j<n;j++){const t=j/n;a.push({x:w*(pts[i][0]*(1-t)+pts[i+1][0]*t),y:h*(pts[i][1]*(1-t)+pts[i+1][1]*t)})}}return a}
  function textPoints(w,h,word){const c=document.createElement("canvas"),x=c.getContext("2d");c.width=620;c.height=190;x.fillStyle="#fff";x.font="800 72px serif";x.textAlign="center";x.textBaseline="middle";x.fillText(word,310,95);const d=x.getImageData(0,0,c.width,c.height).data,a=[];for(let y=0;y<c.height;y+=5)for(let xx=0;xx<c.width;xx+=5)if(d[(y*c.width+xx)*4+3]>80)a.push({x:w/2+(xx-310)*Math.min(w/760,1.35),y:h/2+(y-95)*Math.min(w/760,1.35)});return a.length?a:patterns.heart(w,h)}
  function confetti(n){const c=$("confetti"),x=c.getContext("2d"),d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0);const cs=["#ff8fb4","#ffd3df","#d8b56d","#fff8f5"],p=Array.from({length:n},()=>({x:innerWidth*(.25+Math.random()*.5),y:innerHeight*.3,vx:-4+Math.random()*8,vy:-7+Math.random()*4,s:3+Math.random()*6,a:Math.random()*6,c:cs[Math.floor(Math.random()*cs.length)],l:80+Math.random()*40}));(function f(){x.clearRect(0,0,innerWidth,innerHeight);p.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.vy+=.15;o.a+=.12;o.l--;x.save();x.translate(o.x,o.y);x.rotate(o.a);x.fillStyle=o.c;x.fillRect(-o.s,-o.s/2,o.s*2,o.s);x.restore()});if(p.some(o=>o.l>0&&o.y<innerHeight+40))requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})()}
  const particle=new ParticleSystem();
  if(state.index>0){$("resume").classList.add("show");$("resumeYes").onclick=()=>{$("resume").classList.remove("show");render()};$("resumeNo").onclick=()=>{$("resume").classList.remove("show");reset()}} else render();
