<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Birthday Export Editor</title>
  <style>
    :root{--bg:#050306;--panel:rgba(255,255,255,.075);--ink:#fff8f5;--muted:#cdb8c1;--rose:#ff8fb4;--gold:#d8b56d;--line:rgba(255,174,199,.22);--shadow:0 24px 80px rgba(0,0,0,.45);--sans:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 78% 12%,rgba(255,143,180,.14),transparent 28rem),linear-gradient(145deg,#050306,#100711);color:var(--ink);font-family:var(--sans)}button,input,textarea,select{font:inherit}button{min-height:44px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.08);color:var(--ink);padding:0 14px;cursor:pointer}button.primary{background:linear-gradient(135deg,#fff2ed,#ff9fbd 54%,#d8b56d);color:#13070d;border:0;font-weight:800}button.danger{color:#ffc4d4}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.07);color:var(--ink);padding:10px 12px}textarea{min-height:90px;resize:vertical;line-height:1.55}label{display:grid;gap:6px;color:var(--muted);font-size:13px}label span{color:var(--ink);font-weight:800}.app{min-height:100svh;display:grid;grid-template-columns:300px minmax(0,1fr)}aside{position:sticky;top:0;height:100svh;padding:24px 18px;border-right:1px solid var(--line);background:rgba(8,4,8,.72);backdrop-filter:blur(18px);display:grid;align-content:start;gap:16px}main{padding:28px clamp(16px,4vw,54px) 70px}h1,h2,p{margin:0}h1{font-size:40px;line-height:.98}h2{font-size:22px}p{color:var(--muted);line-height:1.7}.nav{display:grid;gap:8px}.nav button{text-align:left}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.section{margin-top:18px;padding:clamp(16px,3vw,26px);border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);display:grid;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.rows{display:grid;gap:12px}.item{display:grid;gap:12px;padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.045)}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.hint,.status{font-size:13px;color:var(--muted)}.warn{color:#ffd3df}.ok{color:#b9ffd7}.asset-list{display:grid;gap:12px}.asset{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:14px;align-items:start;padding:14px;border:1px solid rgba(255,255,255,.1);border-radius:16px;background:rgba(255,255,255,.04)}.asset-actions{display:flex;gap:8px;flex-wrap:wrap}.file-ui{display:grid;gap:8px}.file-ui input{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}.file-ui .file-pick{display:inline-grid;place-items:center;width:max-content;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.09);color:var(--ink);font-weight:800;cursor:pointer}.file-ui .file-name{font-size:13px;color:#b9ffd7;overflow-wrap:anywhere}.preview{width:160px;height:112px;object-fit:cover;border-radius:12px;background:#160911;border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:10px}.preview img{width:100%;height:100%;object-fit:cover;border-radius:10px}.output{min-height:210px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;white-space:pre}.toast{position:fixed;right:16px;bottom:16px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff8f5;color:#160911;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div><h1>生日檔案編輯器</h1><p>這裡只給寄出前使用。最後請匯出單一 HTML，寄給對方的是 `birthday.html`，不是這個編輯器。</p></div>
      <div class="nav">
        <button data-jump="basic">基本資料</button><button data-jump="memory">照片猜題</button><button data-jump="quiz">Quiz</button><button data-jump="scratch">Scratch / Puzzle</button><button data-jump="timeline">Timeline</button><button data-jump="gallery">Gallery</button><button data-jump="letter">信件 / Final</button><button data-jump="assets">照片音樂</button><button data-jump="export">匯出</button>
      </div>
      <div class="toolbar">
        <button class="primary" id="saveDraft">儲存草稿</button>
        <button id="preview">即時預覽</button>
        <button id="check">檢查缺漏</button>
        <button class="danger" id="clearDraft">清除草稿</button>
      </div>
      <p class="hint" id="sizeHint">尚未估算大小</p>
    </aside>
    <main>
      <section class="section" id="basic"><h2>基本資料</h2><div class="grid">
        <label><span>對方名字</span><input data-path="partnerName"></label><label><span>對方縮寫</span><input data-path="partnerInitials"></label><label><span>我的名字</span><input data-path="myName"></label><label><span>我的縮寫</span><input data-path="myInitials"></label><label><span>生日</span><input data-path="birthday" placeholder="2026-09-18"></label><label><span>紀念日時間</span><input data-path="relationshipStartDate" placeholder="2024-02-14T00:00:00+08:00"></label>
      </div><label><span>開場文字</span><textarea data-path="openingLine"></textarea></label></section>
      <section class="section" id="memory"><h2>照片猜猜看</h2><label><span>猜題照片 key</span><input data-path="memoryQuestion.image" placeholder="memory-question"></label><p class="hint">到「照片音樂」區上傳 memory-question，這張會專門給照片猜猜看使用，不會再跟 Timeline 的 memory-1 混用。</p><label><span>題目</span><input data-path="memoryQuestion.prompt"></label><div class="grid"><label><span>答案 1</span><input data-path="memoryQuestion.answers.0"></label><label><span>答案 2</span><input data-path="memoryQuestion.answers.1"></label><label><span>答案 3</span><input data-path="memoryQuestion.answers.2"></label><label><span>正確答案編號 0-2</span><input data-path="memoryQuestion.correctIndex" type="number" min="0" max="2"></label><label><span>日期</span><input data-path="memoryQuestion.date"></label><label><span>地點</span><input data-path="memoryQuestion.place"></label></div><label><span>回憶文字</span><textarea data-path="memoryQuestion.memory"></textarea></label></section>
      <section class="section" id="quiz"><div class="item-head"><h2>Couple Quiz</h2><button id="addQuiz">新增題目</button></div><div class="rows" id="quizRows"></div></section>
      <section class="section" id="scratch"><h2>Scratch / Puzzle</h2><label><span>Scratch 秘密文字</span><textarea data-path="scratch.message"></textarea></label><label><span>Puzzle 完成文字</span><textarea data-path="puzzle.message"></textarea></label></section>
      <section class="section" id="timeline"><div class="item-head"><h2>Timeline</h2><button id="addTimeline">新增事件</button></div><div class="rows" id="timelineRows"></div></section>
      <section class="section" id="gallery"><div class="item-head"><h2>Gallery</h2><button id="addMemory">新增照片卡</button></div><div class="rows" id="memoryRows"></div></section>
      <section class="section" id="letter"><h2>信件 / Final / Secret</h2><label><span>生日信（一行一段）</span><textarea id="letterText"></textarea></label><label><span>最終告白</span><textarea data-path="finalMessage"></textarea></label><label><span>秘密照片文字</span><textarea data-path="secretMemory.text"></textarea></label></section>
      <section class="section" id="assets"><h2>照片與音樂</h2><p>照片會在瀏覽器內壓縮後轉成 Data URI。建議每張原圖不要超過 8MB，音樂建議小於 5MB。</p><div class="asset-list" id="assetList"></div></section>
      <section class="section" id="export"><h2>匯出最終生日檔案</h2><div class="toolbar"><button class="primary" id="exportHtml">匯出最終生日檔案</button><button id="downloadJson">下載設定備份 JSON</button><button id="loadJsonBtn">載入設定備份 JSON</button><input id="loadJson" type="file" accept="application/json" hidden></div><textarea class="output" id="report" spellcheck="false"></textarea></section>
    </main>
  </div>
  <div class="toast" id="toast">OK</div>
  <script>
  "use strict";
  const TEMPLATE_BASE64="__BIRTHDAY_TEMPLATE_BASE64__";
  const STORE="birthday-editor-draft-v4";
  const DEFAULT_CONFIG={partnerName:"親愛的你",partnerInitials:"YOU",myName:"最想陪你過生日的人",myInitials:"ME",birthday:"2026-09-18",relationshipStartDate:"2024-02-14T00:00:00+08:00",openingLine:"我把幾個小回憶做成一趟生日旅程。慢慢玩，最後有話想跟你說。",memoryQuestion:{prompt:"我們第一次一起慶祝的小日子是哪一天？",answers:["2024.02.14","2024.04.20","2025.08.08"],correctIndex:1,date:"2024.04.20",place:"那個很亮的下午",memory:"答對了。那天其實很普通，但因為是我們一起記住的日子，所以後來就變得很亮。",image:"memory-question"},quiz:[{question:"我最想跟你一起完成哪件事？",answers:["吃一個漂亮蛋糕","拍一張很鬧的合照","一起去新的城市走走"],correctIndex:2,hint:"有吃有拍照也很好，但我更想跟你一起走遠一點。"},{question:"如果今天只能留下一句話，我會說？",answers:["生日快樂","你值得被好好喜歡","今天蛋糕歸我"],correctIndex:1,hint:"蛋糕可以分，但這句話不能省。"},{question:"這份禮物最重要的是什麼？",answers:["動畫","照片","心意"],correctIndex:2,hint:"視覺要漂亮，但真正發光的是心意。"}],scratch:{image:"memory-2",message:"你被喜歡著，而且比你想的還要多。"},puzzle:{image:"puzzle",message:"拼圖完成。還好我們不用被拼回去。"},timeline:[{date:"2024.02.14",title:"第一個小記號",description:"有些日子當下只是日子，後來才知道它會被記很久。",photo:"memory-1"},{date:"2024.04.20",title:"一起笑到停不下來",description:"那種很小、很輕、但一直留在心裡的快樂。",photo:"memory-2"},{date:"2026.09.18",title:"今天",description:"今天不是結尾，是新一頁。生日快樂。",photo:"final"}],memories:[{image:"memory-1",caption:"第一張想放進故事裡的照片。"},{image:"memory-2",caption:"很喜歡的某個瞬間。"},{image:"memory-3",caption:"想再一起去一次的地方。"}],secretHearts:["memory","quiz","timeline"],secretMemory:{image:"secret",text:"這是只有認真找的人才會看到的小秘密。"},letter:["生日快樂。謝謝你一直用你的方式，讓很多普通的日子變得很可愛。","我希望這一年你能更常被溫柔對待，也能更靠近你真正想要的生活。","接下來還想陪你吃很多餐、走很多路、拍很多照片。"],finalMessage:"願你的生日像今天的燭光一樣，亮、暖，而且被好好守著。",music:"",assets:{"memory-question":"","memory-1":"","memory-2":"","memory-3":"","puzzle":"","final":"","secret":""},assetMeta:{"memory-question":{alt:"照片猜猜看照片",focus:"50% 50%"},"memory-1":{alt:"回憶照片一",focus:"50% 50%"},"memory-2":{alt:"回憶照片二",focus:"50% 50%"},"memory-3":{alt:"回憶照片三",focus:"50% 50%"},"puzzle":{alt:"拼圖照片",focus:"50% 50%"},"final":{alt:"最終照片",focus:"50% 50%"},"secret":{alt:"秘密照片",focus:"50% 50%"}}};
  const ASSETS=["memory-question","memory-1","memory-2","memory-3","puzzle","final","secret"]; const $=id=>document.getElementById(id); let config=loadDraft(), assetStats={};
  function clone(v){return JSON.parse(JSON.stringify(v))} function merge(a,b){const out=clone(a);deep(out,b||{});return out} function deep(t,s){Object.entries(s).forEach(([k,v])=>{if(v&&typeof v==="object"&&!Array.isArray(v)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k]))deep(t[k],v);else t[k]=v})}
  function normalize(c){c.assets||(c.assets={});c.assetMeta||(c.assetMeta={});if(!Object.prototype.hasOwnProperty.call(c.assets,"memory-question"))c.assets["memory-question"]="";c.assetMeta["memory-question"]={alt:"照片猜猜看照片",focus:"50% 50%",...(c.assetMeta["memory-question"]||{})};if(!c.memoryQuestion)c.memoryQuestion=clone(DEFAULT_CONFIG.memoryQuestion);if(!c.memoryQuestion.image||c.memoryQuestion.image==="memory-1")c.memoryQuestion.image="memory-question";return c}
  function loadDraft(){try{return normalize(merge(DEFAULT_CONFIG,JSON.parse(localStorage.getItem(STORE)||"{}")))}catch{return normalize(clone(DEFAULT_CONFIG))}} function saveDraft(){normalize(config);localStorage.setItem(STORE,JSON.stringify(config));toast("草稿已儲存");estimate()}
  function get(path){return path.split(".").reduce((o,k)=>o&&o[k],config)} function set(path,value){const p=path.split(".");let o=config;p.slice(0,-1).forEach(k=>{if(!o[k])o[k]={};o=o[k]});o[p.at(-1)]=value}
  function bind(){document.querySelectorAll("[data-path]").forEach(f=>{f.value=get(f.dataset.path)??"";f.oninput=()=>{set(f.dataset.path,f.type==="number"?Number(f.value):f.value);estimate()}});$("letterText").value=(config.letter||[]).join("\n");$("letterText").oninput=()=>{config.letter=$("letterText").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);estimate()}}
  function label(name,node){const l=document.createElement("label");l.append(Object.assign(document.createElement("span"),{textContent:name}),node);return l} function input(v,fn){const e=document.createElement("input");e.value=v??"";e.oninput=()=>{fn(e.value);estimate()};return e} function area(v,fn){const e=document.createElement("textarea");e.value=v??"";e.oninput=()=>{fn(e.value);estimate()};return e} function remove(fn){const b=document.createElement("button");b.className="danger";b.textContent="刪除";b.onclick=fn;return b}
  function renderQuiz(){const r=$("quizRows");r.textContent="";config.quiz.forEach((q,i)=>{const it=document.createElement("div");it.className="item";const h=document.createElement("div");h.className="item-head";h.append(Object.assign(document.createElement("strong"),{textContent:`題目 ${i+1}`}),remove(()=>{config.quiz.splice(i,1);renderQuiz();estimate()}));it.append(h,label("題目",input(q.question,v=>q.question=v)));q.answers.forEach((a,j)=>it.append(label(`選項 ${j+1}`,input(a,v=>q.answers[j]=v))));it.append(label("正確答案編號",input(q.correctIndex,v=>q.correctIndex=Number(v))),label("提示",area(q.hint,v=>q.hint=v)));r.appendChild(it)})}
  function renderTimeline(){const r=$("timelineRows");r.textContent="";config.timeline.forEach((q,i)=>{const it=document.createElement("div");it.className="item";const h=document.createElement("div");h.className="item-head";h.append(Object.assign(document.createElement("strong"),{textContent:`事件 ${i+1}`}),remove(()=>{config.timeline.splice(i,1);renderTimeline();estimate()}));it.append(h,label("日期",input(q.date,v=>q.date=v)),label("標題",input(q.title,v=>q.title=v)),label("描述",area(q.description,v=>q.description=v)),label("照片 key",input(q.photo,v=>q.photo=v)));r.appendChild(it)})}
  function renderMemories(){const r=$("memoryRows");r.textContent="";config.memories.forEach((q,i)=>{const it=document.createElement("div");it.className="item";const h=document.createElement("div");h.className="item-head";h.append(Object.assign(document.createElement("strong"),{textContent:`照片卡 ${i+1}`}),remove(()=>{config.memories.splice(i,1);renderMemories();estimate()}));it.append(h,label("圖片 key",input(q.image,v=>q.image=v)),label("背面文字",area(q.caption,v=>q.caption=v)));r.appendChild(it)})}
  function renderAssets(){const box=$("assetList");box.textContent="";ASSETS.forEach(k=>{const row=document.createElement("div");row.className="asset";const left=document.createElement("div");left.append(label(`${k} 照片`,fileInput(k,"image")));const action=document.createElement("div");action.className="asset-actions";action.append(buttonSmall("清除照片",()=>{config.assets[k]="";delete assetStats[k];renderAssets();estimate()}));left.append(action,label(`${k} Alt Text`,input(config.assetMeta[k]?.alt||"",v=>(config.assetMeta[k]||(config.assetMeta[k]={})).alt=v)),label(`${k} 焦點位置`,input(config.assetMeta[k]?.focus||"50% 50%",v=>(config.assetMeta[k]||(config.assetMeta[k]={})).focus=v)),Object.assign(document.createElement("div"),{className:"hint",textContent:assetStats[k]?`${sizeText(assetStats[k].original)} → ${sizeText(assetStats[k].compressed)}`:(config.assets[k]?"已載入":"尚未上傳")}));const preview=document.createElement("div");preview.className="preview";if(config.assets[k]){const img=new Image();img.src=config.assets[k];img.alt=k;img.onerror=()=>preview.textContent="圖片無法顯示";preview.appendChild(img)}else preview.textContent="尚未上傳";row.append(left,preview);box.appendChild(row)});const music=document.createElement("div");music.className="asset";const left=document.createElement("div");left.append(label("背景音樂 MP3/M4A/OGG/WAV",fileInput("music","audio")));const acts=document.createElement("div");acts.className="asset-actions";acts.append(buttonSmall("清除音樂",()=>{config.music="";delete assetStats.music;renderAssets();estimate()}));left.append(acts);const musicInfo=Object.assign(document.createElement("div"),{className:"hint",textContent:assetStats.music?`${sizeText(assetStats.music.original)} → ${sizeText(assetStats.music.compressed)}`:(config.music?"已載入":"未加入")});if(config.music){const player=document.createElement("audio");player.controls=true;player.src=config.music;player.style.width="100%";player.style.marginTop="8px";musicInfo.appendChild(player)}music.append(left,musicInfo);box.appendChild(music)}
  function buttonSmall(text,fn){const b=document.createElement("button");b.type="button";b.textContent=text;b.onclick=fn;return b}
  function fileInput(key,type){const wrap=document.createElement("div");wrap.className="file-ui";const f=document.createElement("input");f.type="file";f.accept=type==="audio"?"audio/*":"image/*";const pick=document.createElement("button");pick.type="button";pick.className="file-pick";pick.textContent=type==="audio"?"選擇音樂":"選擇照片";pick.onclick=()=>f.click();const name=document.createElement("div");name.className="file-name";name.textContent=assetStats[key]?.name?`已選擇：${assetStats[key].name}`:(key==="music"?config.music:config.assets[key])?"已載入，可重新選擇":"尚未上傳";f.onchange=async()=>{const file=f.files[0];if(!file)return;name.textContent=`處理中：${file.name}`;try{if(type==="audio"){config.music=await readData(file);assetStats.music={name:file.name,original:file.size,compressed:dataSize(config.music)};toast("音樂已內嵌")}else{let result;try{result=await compressImage(file,1680,.82)}catch{const raw=await readData(file);result={data:raw,size:dataSize(raw),fallback:true}}config.assets[key]=result.data;assetStats[key]={name:file.name,original:file.size,compressed:dataSize(result.data)};toast(result.fallback?`${key} 已用原檔內嵌`:`${key} 已壓縮內嵌`)}}catch(err){alert(`上傳失敗：${err.message||err}`)}renderAssets();estimate()};wrap.append(f,pick,name);return wrap}
  function readData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
  function compressImage(file,max=1680,q=.82){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(!b){URL.revokeObjectURL(url);rej(new Error("browser cannot encode image"));return}const rr=new FileReader();rr.onload=()=>{URL.revokeObjectURL(url);res({data:rr.result,size:b.size})};rr.onerror=rej;rr.readAsDataURL(b)},"image/webp",q)}catch(e){URL.revokeObjectURL(url);rej(e)}};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("image load failed"))};img.src=url})}
  function validate(){const warnings=[],errors=[];if(!config.partnerName.trim())errors.push("對方名字未填");if(!config.myName.trim())errors.push("我的名字未填");if(Number.isNaN(new Date(config.relationshipStartDate).getTime()))errors.push("紀念日格式不合法");if(!config.letter.length)errors.push("生日信不可空白");if(!config.finalMessage.trim())errors.push("最終告白不可空白");if(config.quiz.length<3||config.quiz.length>5)warnings.push("Quiz 建議 3-5 題");config.quiz.forEach((q,i)=>{if(q.correctIndex<0||q.correctIndex>=q.answers.length)errors.push(`Quiz 第 ${i+1} 題正確答案編號不合法`)});["memory-question","memory-1","memory-2","puzzle","final"].forEach(k=>{if(!config.assets[k])warnings.push(`${k} 尚未放正式照片`)});if(!config.music)warnings.push("尚未加入背景音樂");if(config.music&&dataSize(config.music)>5*1024*1024)warnings.push("音樂超過 5MB，Gmail 附件可能偏大");if(config.partnerName==="親愛的你")warnings.push("對方名字仍是示範文字");if(config.myName==="最想陪你過生日的人")warnings.push("我的名字仍是示範文字");if(config.openingLine===DEFAULT_CONFIG.openingLine)warnings.push("開場文字仍是示範文字");if(config.memoryQuestion.prompt===DEFAULT_CONFIG.memoryQuestion.prompt)warnings.push("照片猜題仍是示範題目");if((config.letter||[]).join("|")===DEFAULT_CONFIG.letter.join("|"))warnings.push("生日信仍是示範內容");if(config.finalMessage===DEFAULT_CONFIG.finalMessage)warnings.push("最終告白仍是示範內容");if(config.secretMemory.text===DEFAULT_CONFIG.secretMemory.text)warnings.push("秘密照片文字仍是示範內容");return{warnings,errors}}
  function buildHtml(){if(TEMPLATE_BASE64==="__BIRTHDAY_TEMPLATE_BASE64__")throw new Error("請先執行 tools/build.ps1，使用 dist/editor.html 匯出。");const bin=atob(TEMPLATE_BASE64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const template=new TextDecoder("utf-8").decode(bytes);const json=JSON.stringify(config).replace(/</g,"\\u003c");return template.replace(/const CONFIG = loadEmbeddedConfig\(\s*\/\*__CONFIG__\*\/[\s\S]*?\);\n  const CHAPTERS/,`const CONFIG = loadEmbeddedConfig(/*__CONFIG__*/${json},false);\n  const CHAPTERS`)}
  function download(name,text,type="text/html;charset=utf-8"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  function estimate(){const htmlSize=TEMPLATE_BASE64==="__BIRTHDAY_TEMPLATE_BASE64__"?0:Math.round(TEMPLATE_BASE64.length*.75)+JSON.stringify(config).length;const assets=Object.entries(assetStats).map(([k,v])=>`${k}: ${sizeText(v.original)} → ${sizeText(v.compressed)}`).join("\n")||"尚未加入本次素材";$("sizeHint").textContent=`預估最終 HTML：${sizeText(htmlSize)}`;$("report").value=`素材大小\n${assets}\n\n${reportText()}`}
  function reportText(){const v=validate();return `錯誤：${v.errors.length?v.errors.join("；"):"無"}\n警告：${v.warnings.length?v.warnings.join("；"):"無"}\n\n匯出後請寄 Happy-Birthday-${safeName(config.partnerName)}.html，收件人不需要 editor.html 或圖片資料夾。`}
  function dataSize(uri){const i=uri.indexOf(",");return i<0?uri.length:Math.round((uri.length-i-1)*.75)} function sizeText(n){return n>1024*1024?(n/1024/1024).toFixed(2)+" MB":(n/1024).toFixed(1)+" KB"} function safeName(s){return String(s||"Birthday").replace(/[\\/:*?"<>|]/g,"-").trim()||"Birthday"} function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1500)}
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>$(b.dataset.jump).scrollIntoView({behavior:"smooth"}));$("saveDraft").onclick=saveDraft;$("clearDraft").onclick=()=>{if(confirm("清除草稿？")){localStorage.removeItem(STORE);config=normalize(clone(DEFAULT_CONFIG));renderAll();toast("已清除")}};$("check").onclick=()=>{estimate();toast(validate().errors.length?"有錯誤要修":"檢查完成")};$("preview").onclick=()=>{saveDraft();const html=buildHtml();const w=open();w.document.open();w.document.write(html);w.document.close()};$("exportHtml").onclick=()=>{estimate();const v=validate();if(v.errors.length){alert("請先修正：\n"+v.errors.join("\n"));return}if(v.warnings.length&&!confirm("仍有警告：\n"+v.warnings.join("\n")+"\n\n仍要匯出嗎？"))return;const html=buildHtml();download(`Happy-Birthday-${safeName(config.partnerName)}.html`,html);toast("已匯出最終 HTML")};$("downloadJson").onclick=()=>download("birthday-config.json",JSON.stringify(normalize(config),null,2),"application/json;charset=utf-8");$("loadJsonBtn").onclick=()=>$("loadJson").click();$("loadJson").onchange=async e=>{const f=e.target.files[0];if(!f)return;config=normalize(merge(DEFAULT_CONFIG,JSON.parse(await f.text())));renderAll();toast("已載入備份")};$("addQuiz").onclick=()=>{config.quiz.push({question:"新題目",answers:["選項一","選項二","選項三"],correctIndex:0,hint:"提示文字"});renderQuiz();estimate()};$("addTimeline").onclick=()=>{config.timeline.push({date:"2026.09.18",title:"新的回憶",description:"描述這一天。",photo:"memory-1"});renderTimeline();estimate()};$("addMemory").onclick=()=>{config.memories.push({image:"memory-1",caption:"照片背面的文字"});renderMemories();estimate()};
  function renderAll(){bind();renderQuiz();renderTimeline();renderMemories();renderAssets();estimate()} renderAll();
  </script>
